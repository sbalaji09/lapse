# Ground truth: which SNOMED conditions (as Synthea codes them) fall in a medically-frail qualifying
# category, grouped into families that share note sentences in data/impairment_library.yaml.
#
# This is the world's truth, not the state's view. The state's code list (rules/codes/*.txt) is a
# separate, narrower thing that A2 builds; the gap between the two is what Lapse finds.
#
#   category   - PROJECT.md qualifying category
#   condition  - plain name used in notes and clinician questions
#   physical   - limitation shows up as standing/walking tolerance (drives standing_tolerance_minutes)
#   p_impairs  - chance the condition significantly impairs this person (seeded draw in engine/truth.py)
groups:
  diabetic_neuropathy:
    category: physical_disability
    condition: diabetic peripheral neuropathy
    physical: true
    p_impairs: 0.6
    codes: {"368581000119106": Neuropathy due to type 2 diabetes mellitus}
  ckd_advanced:
    category: serious_complex_medical
    condition: chronic kidney disease
    physical: true
    p_impairs: 0.7
    codes:
      "433144002": Chronic kidney disease stage 3
      "431857002": Chronic kidney disease stage 4
      "46177005": End-stage renal disease
      "698306007": Awaiting transplantation of kidney
  copd:
